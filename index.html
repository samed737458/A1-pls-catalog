  <script>
    const whatsappNumber = "966500000000"; // اكتب رقم الواتساب هنا
    let cart = [];

    fetch('products.json')
      .then(res => res.json())
      .then(products => {
        const container = document.getElementById('catalog');
        container.innerHTML = ''; // تفريغ المحتوى القديم

        products.forEach((p, idx) => {
          // إضافة ./ لضمان قراءة الصورة بنفس المجلد
          const imgPath = p.image.startsWith('http') ? p.image : './' + p.image;

          container.innerHTML += `
            <div class="card ${idx === 0 ? 'active' : ''}">
              <div class="img-container">
                <span class="badge">منتج معتمد</span>
                <img src="${imgPath}" alt="${p.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x260/161616/ffffff?text=صورة+المنتج';">
              </div>
              <div class="card-body">
                <div class="product-title">${p.name}</div>
                <div class="price">${p.price}</div>
                
                <div>
                  <div class="options-label">التعبئة / الشد:</div>
                  <div class="color-options">
                    <span style="font-size:0.85rem; color:#00d2d3; font-weight:bold">${p.pack_info || 'متوفر'}</span>
                  </div>
                </div>

                <div>
                  <div class="options-label">الكمية:</div>
                  <select class="size-select" id="qty-${p.id}">
                    <option value="1 شد">1 شد</option>
                    <option value="2 شد">2 شد</option>
                    <option value="5 شد">5 شد</option>
                    <option value="10 شد">10 شد</option>
                  </select>
                </div>

                <button class="btn-add" onclick="addToCart('${p.name}', '${p.price}', ${p.id})">أضف إلى السلة</button>
              </div>
            </div>
          `;
        });
      })
      .catch(err => console.error('خطأ في تحميل المنتجات:', err));

    function addToCart(name, price, id) {
      const qty = document.getElementById(`qty-${id}`).value;
      cart.push({ name, price, qty });
      updateCartUI();
    }

    function clearCart() {
      cart = [];
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = `السلة تحتوي على (${cart.length} منتجات)`;
    }

    function sendOrder(e) {
      e.preventDefault();
      if(cart.length === 0) { alert('السلة فارغة!'); return; }
      
      let msg = "السلام عليكم، أريد طلب المنتجات التالية من الكتالوج:\n\n";
      cart.forEach((item, i) => {
        msg += `${i+1}. ${item.name} - الكمية: ${item.qty} (${item.price})\n`;
      });
      
      window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
    }
  </script>
